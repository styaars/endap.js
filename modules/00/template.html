    "endap": "/libs/endap/0.0.3/endap.min.js"
  }

<div id="cnt1">
</div>


<script type=module>
import { Console as CLI } from "endap";
import { RandNum as RNU } from "endap";

// Buat konsol
const consoles = CLI.create("60px"); // Bikin sedikit lebih tinggi agar muat 2 baris

const cnt = document.getElementById("cnt1");
cnt.append(consoles.el);

const min = 10;
const max = 90;
const n = 10;

// Generate array
const x = RNU.randIntN(min, max, n);

// Cetak label dan array
consoles.log("x = ");
consoles.log(JSON.stringify(x)); // Konversi array ke string agar tampil utuh
</script>
