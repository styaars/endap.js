<div id="cnt1"></div>

<script type=module>
import { Console as CLI } from "endap";

// Bikin konsol dan pasang ke <div id="cnt1">
const consoles = CLI.create("40px"); // Diperbesar ke 100px agar muat output teks
const cnt = document.getElementById("cnt1");
cnt.append(consoles.el);

// Jalankan logika angka acak
const min = 10;
const max = 90;
const n = 10;
const x = RNU.randIntN(min, max, n);

consoles.log("x = ", "");
consoles.log(x);
